# Kite Ground Control — Release build (manual)
#
# Run it from the Actions tab ("Release build" -> Run workflow) or with `gh workflow run release.yml`.
# Every job uploads one artifact, named kite-gc-<platform>-<version>-<commit>; the files inside carry
# the unified names of scripts/collect-release.*. Nothing is published: a release is put together by
# hand from these and from the locally signed builds (macOS, Android — the APKs here are `_debug.apk`).
#
# Linux base: glibc is not bundled, so the build host's glibc is the floor for every user (24.04 =
# 2.39). Never build on a newer base than the oldest system to support.

name: Release build

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Build (Windows x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Build Tauri bundle
        run: npm run tauri build
      - name: Collect + rename artifacts
        run: powershell -ExecutionPolicy Bypass -File scripts/collect-release.ps1
      - name: Name the artifact
        id: build
        shell: bash
        run: echo "id=$(node -p "require('./package.json').version")-${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v5
        with:
          name: kite-gc-windows-x64-${{ steps.build.outputs.id }}
          if-no-files-found: error
          path: release/*

  # UNSIGNED: no Apple credentials on CI. The released macOS build is signed and notarized locally
  # (`just notarize-macos`); an unsigned update archive must never reach a release (it replaces a
  # signed copy and macOS drops its permissions) — make-update-manifest.sh refuses it.
  macos:
    name: Build (macOS universal · unsigned)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Fetch bundled ffmpeg (arm64 + x86_64 → universal sidecar)
        run: bash scripts/fetch-ffmpeg-macos.sh
      - name: Build Tauri bundle (universal)
        run: npm run tauri build -- --target universal-apple-darwin --bundles app dmg
      - name: Collect + rename artifacts
        run: bash scripts/collect-release.sh
      - name: Name the artifact
        id: build
        run: echo "id=$(node -p "require('./package.json').version")-${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v5
        with:
          name: kite-gc-macos-universal-${{ steps.build.outputs.id }}
          if-no-files-found: error
          path: release/*

  linux:
    name: Build (Linux ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v5
      # apt has no timeout of its own and the runners' mirror sometimes hangs mid-fetch: bounded, so
      # a dead mirror fails in minutes and the job can be re-run.
      - name: Install system dependencies
        timeout-minutes: 10
        run: |
          APT_OPTS='-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30'
          sudo apt-get $APT_OPTS update
          sudo apt-get $APT_OPTS install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libudev-dev \
            zip
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Build Tauri bundle
        run: npm run tauri build
      - name: Collect + rename artifacts
        run: bash scripts/collect-release.sh
      - name: Name the artifact
        id: build
        run: echo "id=$(node -p "require('./package.json').version")-${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v5
        with:
          name: kite-gc-linux-${{ matrix.arch }}-${{ steps.build.outputs.id }}
          if-no-files-found: error
          path: release/*

  # Without the four KEYSTORE_* secrets Gradle signs with a debug key the runner makes up: such an APK
  # never installs over a copy signed with another key — a test build, not a release.
  android:
    name: Build (Android arm64 + armv7)
    runs-on: ubuntu-latest
    env:
      # A step's own `env:` is not visible to its `if:`, hence at job level.
      KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
      # Pinned: an NDK bump should be a visible commit. Same pin as ci.yml.
      NDK_VERSION: '27.2.12479018'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          # The action's default also asks for the legacy "tools" package, which Google's repository
          # no longer lists — sdkmanager then fails the step.
          packages: platform-tools
      - name: Install NDK ${{ env.NDK_VERSION }}
        run: |
          sdkmanager --install "ndk;${{ env.NDK_VERSION }}"
          echo "NDK_HOME=$ANDROID_HOME/ndk/${{ env.NDK_VERSION }}" >> "$GITHUB_ENV"

      - name: Configure signing key
        if: ${{ env.KEYSTORE_B64 != '' }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          APP_DIR=src-tauri/gen/android/app
          echo "$KEYSTORE_B64" | base64 -d > "$APP_DIR/release.jks"
          # build.gradle.kts resolves storeFile relative to the module directory.
          {
            echo "storeFile=release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > "$APP_DIR/key.properties"
      - name: Note the signing key in use
        if: ${{ env.KEYSTORE_B64 == '' }}
        run: echo "::warning::No KEYSTORE_B64 secret — this APK is signed with a throwaway debug key and will NOT install over a released copy."

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: android

      - name: Build APKs
        run: npm run tauri android build -- --apk --split-per-abi --target aarch64 armv7
      - name: Collect + rename artifacts
        run: bash scripts/collect-release.sh --android-only
      - name: Verify the APKs are signed
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          test -x "$APKSIGNER" || { echo "::error::apksigner not found in the SDK"; exit 1; }
          ls release/*.apk >/dev/null || { echo "::error::no APK was produced"; exit 1; }
          for apk in release/*.apk; do
            echo "== $apk"
            "$APKSIGNER" verify --verbose "$apk"
          done
      # Same file name as the release-key APK otherwise, and one overwrites the other in release/.
      - name: Mark the APKs as debug-signed
        if: ${{ env.KEYSTORE_B64 == '' }}
        run: for f in release/*_installer.apk; do mv "$f" "${f%_installer.apk}_debug.apk"; done
      - name: Name the artifact
        id: build
        run: echo "id=$(node -p "require('./package.json').version")-${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
      - name: Upload Android artifacts
        uses: actions/upload-artifact@v5
        with:
          name: kite-gc-android-${{ steps.build.outputs.id }}
          if-no-files-found: error
          path: release/*
