# Kite Ground Control — Release build (manual)
#
# Manually triggered only (Actions tab -> "Release build" -> Run workflow, or
# `gh workflow run release.yml`). Builds the distributable artifacts on a pinned,
# broadly-compatible base and uploads them as downloadable workflow artifacts —
# download them from the run and attach them to a GitHub release by hand.
#
# Deliberately NOT triggered on push/tags: releases are cut on demand, not per commit.
#
# Linux is built on ubuntu-24.04, and the base decides two things at once.
#
# 1. The AppImage bundles the BUILD HOST's WebKitGTK (linuxdeploy takes what is installed), so the
#    base picks the browser engine every AppImage user gets. jammy (22.04) is stuck on WebKitGTK
#    2.50.4, which has a fault that pins ~300 % CPU forever after an RTSP/MJPEG feed is stopped —
#    measured on a Debian laptop and a Raspberry Pi 4, and absent both from the .deb (system engine)
#    and from a locally built AppImage, each on 2.52.5. noble (24.04) carries the 2.52 series.
# 2. glibc is NOT bundled, so it comes from the target system and only ever works upwards: the
#    highest GLIBC_* symbol in the binary is the floor. 22.04 gave 2.34 (ran on Debian 12 and
#    Raspberry Pi OS Bookworm); 24.04 gives 2.39, so those systems now need a newer distribution
#    or a local build. Accepted deliberately — an engine that burns a core forever is worse than a
#    version floor, and a second "legacy" artifact was not wanted.
#
# Do NOT build on a rolling/newer base than the oldest target: it over-bundles newer libs and breaks
# on older systems (e.g. the libgcrypt/libgpg-error symbol mismatch).

name: Release build

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Build (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Build Tauri bundle
        run: npm run tauri build
      - name: Collect + rename artifacts
        run: powershell -ExecutionPolicy Bypass -File scripts/collect-release.ps1
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v5
        with:
          name: kite-gc-windows
          if-no-files-found: error
          path: release/*

  # Universal macOS build (arm64 + x86_64 in one .app/.dmg) so a single download runs on both Apple
  # Silicon and Intel Macs. Built UNSIGNED on purpose: no Apple Developer credentials are placed on CI
  # (they stay on the maintainer's machine — see `just notarize-macos` for the local sign+notarize
  # step). An unsigned download is Gatekeeper-quarantined: first launch is right-click -> Open, or run
  # `xattr -dr com.apple.quarantine "/Applications/Kite Ground Control.app"`.
  macos:
    name: Build (macOS universal · unsigned)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Fetch bundled ffmpeg (arm64 + x86_64 → universal sidecar)
        run: bash scripts/fetch-ffmpeg-macos.sh
      - name: Build Tauri bundle (universal)
        run: npm run tauri build -- --target universal-apple-darwin --bundles app dmg
      - name: Collect + rename artifacts
        run: bash scripts/collect-release.sh
      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v5
        with:
          name: kite-gc-macos-universal
          if-no-files-found: error
          path: release/*

  linux:
    name: Build (Linux · ubuntu-24.04)
    runs-on: ubuntu-24.04
    env:
      # Let appimagetool/linuxdeploy run without FUSE on the CI runner — they are AppImages
      # themselves and would otherwise try to mount. This is also why no libfuse2 is installed:
      # with this set it is genuinely unused (verified by building on a host that has neither the
      # package nor the kernel module), and noble renamed it to libfuse2t64 anyway, so asking for
      # the old name would fail the job outright.
      APPIMAGE_EXTRACT_AND_RUN: 1
    steps:
      - uses: actions/checkout@v5
      # Bounded on purpose: the ubuntu runners' Azure apt mirror sporadically hangs mid-fetch, and
      # apt has no timeout of its own — jobs sat at "install dependencies" for hours (three times,
      # 2026-08-18/19). With per-request timeouts + retries a dead mirror fails in minutes and the
      # job can simply be re-run; timeout-minutes is the backstop.
      - name: Install system dependencies
        timeout-minutes: 10
        run: |
          APT_OPTS='-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30'
          sudo apt-get $APT_OPTS update
          sudo apt-get $APT_OPTS install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libudev-dev \
            patchelf \
            file \
            xdg-utils \
            zip
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Build Tauri bundle
        run: npm run tauri build
      - name: Collect + rename artifacts
        run: bash scripts/collect-release.sh
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v5
        with:
          name: kite-gc-linux
          if-no-files-found: error
          path: release/*

  # Native aarch64 build on GitHub's ARM64 Linux runner (free for public repos) — no cross-compile, so
  # the Pi 5 (and other arm64 Linux) gets a ready binary/.deb/.AppImage without a local build env. Same
  # ubuntu-24.04 base as the x86 Linux job, for the same two reasons (see the header): it decides the
  # AppImage's bundled WebKitGTK, and with it the glibc floor.
  linux-arm64:
    name: Build (Linux ARM64 · ubuntu-24.04-arm)
    runs-on: ubuntu-24.04-arm
    env:
      # Let appimagetool/linuxdeploy run without FUSE on the CI runner — they are AppImages
      # themselves and would otherwise try to mount. This is also why no libfuse2 is installed:
      # with this set it is genuinely unused (verified by building on a host that has neither the
      # package nor the kernel module), and noble renamed it to libfuse2t64 anyway, so asking for
      # the old name would fail the job outright.
      APPIMAGE_EXTRACT_AND_RUN: 1
    steps:
      - uses: actions/checkout@v5
      # Bounded on purpose: the ubuntu runners' Azure apt mirror sporadically hangs mid-fetch, and
      # apt has no timeout of its own — jobs sat at "install dependencies" for hours (three times,
      # 2026-08-18/19). With per-request timeouts + retries a dead mirror fails in minutes and the
      # job can simply be re-run; timeout-minutes is the backstop.
      - name: Install system dependencies
        timeout-minutes: 10
        run: |
          APT_OPTS='-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30'
          sudo apt-get $APT_OPTS update
          sudo apt-get $APT_OPTS install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libudev-dev \
            patchelf \
            file \
            xdg-utils \
            zip
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Build Tauri bundle
        run: npm run tauri build
      - name: Collect + rename artifacts
        run: bash scripts/collect-release.sh
      - name: Upload Linux ARM64 artifacts
        uses: actions/upload-artifact@v5
        with:
          name: kite-gc-linux-arm64
          if-no-files-found: error
          path: release/*
